<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033"/>
      <stop offset="100%" stop-color="#B30024"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF0033" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#2B2B2B" stroke-width="4"/>
  
  <!-- Outer Shield Emblem with subtle drop shadow -->
  <path d="M256 75 L390 135 C390 270 320 370 256 418 C192 370 122 270 122 135 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>
  
  <!-- Inner White Play Triangle -->
  <polygon points="230,200 325,256 230,312" fill="#FFFFFF"/>
  
  <!-- Green Verified Badge -->
  <circle cx="372" cy="140" r="38" fill="#10B981" stroke="#0F0F0F" stroke-width="8"/>
  <path d="M358 140 L368 150 L388 130" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
